# Render Blueprint: https://render.com/docs/blueprint-spec
# Backend needs a paid instance type because persistent disks are not available on the free plan.
services:
  - type: web
    name: llm-chatbot-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    numInstances: 1
    healthCheckPath: /health
    disk:
      name: chat-data
      mountPath: /data        # SQLite lives at /data/app.db on this persistent disk
      sizeGB: 1
    envVars:
      - key: LLM_API_KEYS
        sync: false           # set in the dashboard: key1,key2
      - key: LLM_MODEL
        value: gemini/gemini-3.5-flash-lite
      - key: DATABASE_URL
        value: sqlite:////data/app.db
      - key: ALLOWED_ORIGINS
        sync: false           # e.g. https://llm-chatbot-frontend.onrender.com
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"
      - key: CACHE_ENABLED
        value: "true"

  - type: web
    name: llm-chatbot-frontend
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: API_BASE_URL
        sync: false           # e.g. https://llm-chatbot-backend.onrender.com
