# Fly.io alternative for the backend (persistent volume at /data).
#   fly launch --no-deploy --copy-config --name <your-backend-app>
#   fly volumes create chat_data --size 1 --region <region>
#   fly secrets set LLM_API_KEYS="key1,key2" ALLOWED_ORIGINS="https://<frontend-host>"
#   fly deploy
app = "llm-chatbot-backend"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  DATABASE_URL = "sqlite:////data/app.db"
  LLM_MODEL = "gemini/gemini-3.5-flash-lite"
  ENABLE_FAILURE_SIMULATION = "true"
  CACHE_ENABLED = "true"
  PORT = "8000"

[[mounts]]
  source = "chat_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # Keep one machine running: SQLite volume is attached to a single machine and the
  # LiteLLM cache is in-memory.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"
